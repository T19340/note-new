<script>/* ============================================================
   시각화 코어 — 이 노트 전용 미니 라이브러리
   ============================================================ */
(function(){
'use strict';

const CL = {
  ink:'#1b1b1d', ink2:'#3d3d42', mute:'#83838a', grid:'#eae7df', axis:'#6a6a72',
  up:'#1E5AA8', down:'#C0392B', con:'#1F8A5B', grad:'#E07B00', obj:'#7A5AA8',
  accent:'#B4531A', flat:'#9aa0a8', paper:'#ffffff'
};
window.CL = CL;

function fit(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600;
  const h = parseFloat(cv.dataset.h || 300);
  cv.style.height = h + 'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}

class Frame {
  constructor(cv, xr, yr, pad){
    this.cv = cv;
    const s = fit(cv);
    this.ctx = s.ctx; this.w = s.w; this.h = s.h;
    this.pad = Object.assign({l:36,r:14,t:14,b:28}, pad||{});
    this.setRange(xr, yr);
  }
  setRange(xr, yr){
    this.xr = xr.slice(); this.yr = yr.slice();
    this.pw = this.w - this.pad.l - this.pad.r;
    this.ph = this.h - this.pad.t - this.pad.b;
  }
  /* 종횡비를 1:1로 맞춤 (기하 그림용) */
  square(){
    const sx = this.pw/(this.xr[1]-this.xr[0]), sy = this.ph/(this.yr[1]-this.yr[0]);
    const s = Math.min(sx, sy);
    const cx = (this.xr[0]+this.xr[1])/2, cy = (this.yr[0]+this.yr[1])/2;
    const hx = this.pw/(2*s), hy = this.ph/(2*s);
    this.xr = [cx-hx, cx+hx]; this.yr = [cy-hy, cy+hy];
    return this;
  }
  X(x){ return this.pad.l + (x-this.xr[0])/(this.xr[1]-this.xr[0])*this.pw; }
  Y(y){ return this.pad.t + (1-(y-this.yr[0])/(this.yr[1]-this.yr[0]))*this.ph; }
  IX(px){ return this.xr[0] + (px-this.pad.l)/this.pw*(this.xr[1]-this.xr[0]); }
  IY(py){ return this.yr[0] + (1-(py-this.pad.t)/this.ph)*(this.yr[1]-this.yr[0]); }
  clear(bg){ const c=this.ctx; c.clearRect(0,0,this.w,this.h); if(bg){c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);} }
  clip(){ const c=this.ctx; c.save(); c.beginPath(); c.rect(this.pad.l,this.pad.t,this.pw,this.ph); c.clip(); }
  unclip(){ this.ctx.restore(); }
  grid(stepX, stepY){
    const c=this.ctx; c.save(); c.strokeStyle=CL.grid; c.lineWidth=1;
    const sx = stepX || niceStep(this.xr), sy = stepY || niceStep(this.yr);
    c.beginPath();
    for(let x=Math.ceil(this.xr[0]/sx)*sx; x<=this.xr[1]+1e-9; x+=sx){ c.moveTo(this.X(x),this.pad.t); c.lineTo(this.X(x),this.pad.t+this.ph); }
    for(let y=Math.ceil(this.yr[0]/sy)*sy; y<=this.yr[1]+1e-9; y+=sy){ c.moveTo(this.pad.l,this.Y(y)); c.lineTo(this.pad.l+this.pw,this.Y(y)); }
    c.stroke(); c.restore();
  }
  axes(opt){
    opt = opt||{};
    const c=this.ctx; c.save();
    c.strokeStyle=CL.axis; c.lineWidth=1.2; c.fillStyle=CL.mute;
    c.font='11px ui-monospace,Consolas,monospace'; c.textAlign='center'; c.textBaseline='top';
    const y0 = Math.max(this.yr[0], Math.min(this.yr[1], 0));
    const x0 = Math.max(this.xr[0], Math.min(this.xr[1], 0));
    c.beginPath();
    c.moveTo(this.pad.l, this.Y(y0)); c.lineTo(this.pad.l+this.pw, this.Y(y0));
    c.moveTo(this.X(x0), this.pad.t); c.lineTo(this.X(x0), this.pad.t+this.ph);
    c.stroke();
    if(opt.ticks!==false){
      const sx = opt.stepX || niceStep(this.xr), sy = opt.stepY || niceStep(this.yr);
      let xcut = Infinity;
      if(opt.xlab){ c.save(); c.font='600 11.5px ui-monospace,Consolas,monospace';
        xcut = this.pad.l+this.pw - c.measureText(opt.xlab).width - 9; c.restore(); }
      for(let x=Math.ceil(this.xr[0]/sx)*sx; x<=this.xr[1]+1e-9; x+=sx){
        if(Math.abs(x)<1e-9) continue;
        if(this.X(x) > xcut) continue;
        c.fillText(fmt(x), this.X(x), this.Y(y0)+5);
      }
      c.textAlign='right'; c.textBaseline='middle';
      for(let y=Math.ceil(this.yr[0]/sy)*sy; y<=this.yr[1]+1e-9; y+=sy){
        if(Math.abs(y)<1e-9) continue;
        c.fillText(fmt(y), this.X(x0)-5, this.Y(y));
      }
    }
    if(opt.xlab){ c.textAlign='right'; c.textBaseline='top'; c.fillStyle=CL.ink2; c.font='600 11.5px ui-monospace,Consolas,monospace';
      c.fillText(opt.xlab, this.pad.l+this.pw, this.Y(y0)+5); }
    if(opt.ylab){ c.textAlign='left'; c.textBaseline='top'; c.fillStyle=CL.ink2; c.font='600 11.5px ui-monospace,Consolas,monospace';
      c.fillText(opt.ylab, this.X(x0)+5, this.pad.t); }
    c.restore();
  }
  curve(f, o){
    o=o||{}; const c=this.ctx; c.save();
    c.strokeStyle=o.color||CL.ink; c.lineWidth=o.lw||2; if(o.dash) c.setLineDash(o.dash);
    c.beginPath(); let started=false;
    const N=o.n||400;
    for(let i=0;i<=N;i++){
      const x=this.xr[0]+(this.xr[1]-this.xr[0])*i/N, y=f(x);
      if(!isFinite(y)){ started=false; continue; }
      const py=this.Y(y);
      if(py<this.pad.t-3000||py>this.pad.t+this.ph+3000){ started=false; continue; }
      if(!started){ c.moveTo(this.X(x),py); started=true; } else c.lineTo(this.X(x),py);
    }
    c.stroke(); c.restore();
  }
  path(pts, o){
    o=o||{}; const c=this.ctx; if(!pts.length) return; c.save();
    c.strokeStyle=o.color||CL.ink; c.lineWidth=o.lw||2; if(o.dash) c.setLineDash(o.dash);
    c.lineJoin='round';
    c.beginPath(); c.moveTo(this.X(pts[0][0]),this.Y(pts[0][1]));
    for(let i=1;i<pts.length;i++) c.lineTo(this.X(pts[i][0]),this.Y(pts[i][1]));
    if(o.close) c.closePath();
    if(o.fill){ c.fillStyle=o.fill; c.fill(); }
    if(o.color!==false) c.stroke();
    c.restore();
  }
  seg(p,q,o){ this.path([p,q],o); }
  arrow(p,q,o){
    o=o||{}; const c=this.ctx; c.save();
    const x1=this.X(p[0]),y1=this.Y(p[1]),x2=this.X(q[0]),y2=this.Y(q[1]);
    const col=o.color||CL.ink, lw=o.lw||2;
    c.strokeStyle=col; c.fillStyle=col; c.lineWidth=lw; c.lineCap='round';
    const a=Math.atan2(y2-y1,x2-x1), hl=o.head||9;
    const L=Math.hypot(x2-x1,y2-y1); if(L<1){c.restore();return;}
    const bx=x2-Math.cos(a)*hl*0.82, by=y2-Math.sin(a)*hl*0.82;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(bx,by); c.stroke();
    c.beginPath(); c.moveTo(x2,y2);
    c.lineTo(x2-Math.cos(a-0.42)*hl, y2-Math.sin(a-0.42)*hl);
    c.lineTo(x2-Math.cos(a+0.42)*hl, y2-Math.sin(a+0.42)*hl);
    c.closePath(); c.fill();
    c.restore();
  }
  dot(p,o){
    o=o||{}; const c=this.ctx; c.save();
    c.beginPath(); c.arc(this.X(p[0]),this.Y(p[1]),o.r||5,0,7);
    c.fillStyle=o.fill||CL.ink; c.fill();
    if(o.stroke!==false){ c.lineWidth=o.lw||2; c.strokeStyle=o.stroke||'#fff'; c.stroke(); }
    c.restore();
  }
  text(p,s,o){
    o=o||{}; const c=this.ctx; c.save();
    c.font=o.font||'600 12px '+(o.mono?'ui-monospace,Consolas,monospace':'system-ui,sans-serif');
    c.fillStyle=o.color||CL.ink; c.textAlign=o.align||'left'; c.textBaseline=o.base||'bottom';
    const x=this.X(p[0])+(o.dx||0), y=this.Y(p[1])+(o.dy||0);
    if(o.bg){ const m=c.measureText(s); const pd=3;
      const wd=m.width+pd*2, ht=(o.fs||12)+pd*2;
      let bx=x-pd; if(o.align==='center') bx=x-wd/2; if(o.align==='right') bx=x-wd+pd;
      let by=y-ht+pd; if(o.base==='top') by=y-pd; if(o.base==='middle') by=y-ht/2;
      c.fillStyle=o.bg; c.fillRect(bx,by,wd,ht); c.fillStyle=o.color||CL.ink;
    }
    c.fillText(s,x,y); c.restore();
  }
  px(p){ return [this.X(p[0]), this.Y(p[1])]; }
}

function niceStep(r){
  const span=r[1]-r[0], raw=span/6, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  return (n<1.5?1:n<3?2:n<7?5:10)*mag;
}
function fmt(v){
  if(Math.abs(v)<1e-9) return '0';
  const a=Math.abs(v);
  if(a>=1000||a<0.01) return v.toExponential(0);
  return (Math.round(v*100)/100).toString();
}

/* ---------- 등고선 (marching squares) ---------- */
function contourSegs(f, xr, yr, N, level){
  const segs=[], dx=(xr[1]-xr[0])/N, dy=(yr[1]-yr[0])/N, g=[];
  for(let i=0;i<=N;i++){ g[i]=[]; for(let j=0;j<=N;j++) g[i][j]=f(xr[0]+i*dx, yr[0]+j*dy)-level; }
  const ip=(x1,y1,v1,x2,y2,v2)=>{ const t=v1/(v1-v2); return [x1+t*(x2-x1), y1+t*(y2-y1)]; };
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x0=xr[0]+i*dx, y0=yr[0]+j*dy, x1=x0+dx, y1=y0+dy;
    const a=g[i][j], b=g[i+1][j], c=g[i+1][j+1], d=g[i][j+1];
    if(!isFinite(a+b+c+d)) continue;
    const p=[];
    if((a<0)!==(b<0)) p.push(ip(x0,y0,a,x1,y0,b));
    if((b<0)!==(c<0)) p.push(ip(x1,y0,b,x1,y1,c));
    if((c<0)!==(d<0)) p.push(ip(x1,y1,c,x0,y1,d));
    if((d<0)!==(a<0)) p.push(ip(x0,y1,d,x0,y0,a));
    if(p.length===2) segs.push([p[0],p[1]]);
    else if(p.length===4){
      const ctr=(a+b+c+d)/4;
      if(ctr<0){ segs.push([p[0],p[1]]); segs.push([p[2],p[3]]); }
      else { segs.push([p[1],p[2]]); segs.push([p[3],p[0]]); }
    }
  }
  return segs;
}
function drawContours(fr, f, levels, o){
  o=o||{}; const c=fr.ctx; const N=o.n||110;
  c.save(); c.lineWidth=o.lw||1.2; c.lineJoin='round';
  levels.forEach(lv=>{
    const col = (typeof o.color==='function') ? o.color(lv) : (o.color||'#b9b3a6');
    c.strokeStyle=col;
    if(o.dashFor && o.dashFor(lv)) c.setLineDash([4,3]); else c.setLineDash([]);
    c.beginPath();
    contourSegs(f, fr.xr, fr.yr, N, lv).forEach(s=>{
      c.moveTo(fr.X(s[0][0]),fr.Y(s[0][1])); c.lineTo(fr.X(s[1][0]),fr.Y(s[1][1]));
    });
    c.stroke();
  });
  c.restore();
}
/* 등고선 색 채우기 (히트맵) */
function heat(fr, f, lo, hi, ramp, step){
  const c=fr.ctx, s=step||3; c.save();
  for(let px=fr.pad.l; px<fr.pad.l+fr.pw; px+=s)
    for(let py=fr.pad.t; py<fr.pad.t+fr.ph; py+=s){
      const v=f(fr.IX(px+s/2), fr.IY(py+s/2));
      let t=(v-lo)/(hi-lo); t=t<0?0:t>1?1:t;
      c.fillStyle=ramp(t); c.fillRect(px,py,s,s);
    }
  c.restore();
}
function mixHex(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A=p(a),B=p(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
}

/* ---------- 3D 와이어/면 표면 ---------- */
function surface3D(cv, f, o){
  o=o||{};
  const s=fit(cv), c=s.ctx, W=s.w, H=s.h;
  c.clearRect(0,0,W,H);
  const xr=o.xr||[-2,2], yr=o.yr||[-2,2], N=o.n||30;
  const az=o.az!==undefined?o.az:-0.62, el=o.el!==undefined?o.el:0.52;
  const ca=Math.cos(az), sa=Math.sin(az), se=Math.sin(el);
  /* z 범위 자동 */
  let zmin=Infinity, zmax=-Infinity;
  const Z=[];
  for(let i=0;i<=N;i++){ Z[i]=[];
    for(let j=0;j<=N;j++){
      const x=xr[0]+(xr[1]-xr[0])*i/N, y=yr[0]+(yr[1]-yr[0])*j/N;
      const z=f(x,y); Z[i][j]=z;
      if(isFinite(z)){ if(z<zmin)zmin=z; if(z>zmax)zmax=z; }
    }
  }
  if(o.zr){ zmin=o.zr[0]; zmax=o.zr[1]; }
  const zsp=(zmax-zmin)||1;
  const cx=W/2, cy=H*0.56;
  const scale=Math.min(W/2.55, H/2.0)/Math.max(xr[1]-xr[0],yr[1]-yr[0])*2;
  const zs=(o.zh||0.42)*Math.min(W,H*1.5);
  const nx=x=>(x-(xr[0]+xr[1])/2)/((xr[1]-xr[0])/2);
  const ny=y=>(y-(yr[0]+yr[1])/2)/((yr[1]-yr[0])/2);
  const nz=z=>{ let t=(z-zmin)/zsp; return t<0?0:t>1?1:t; };
  function proj(x,y,z){
    const X=nx(x)*ca - ny(y)*sa, Y=nx(x)*sa + ny(y)*ca;
    return [cx + X*scale, cy - Y*scale*se - (nz(z)-0.5)*zs, Y];
  }
  /* 사각형 면 수집 */
  const quads=[];
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const xa=xr[0]+(xr[1]-xr[0])*i/N, xb=xr[0]+(xr[1]-xr[0])*(i+1)/N;
    const ya=yr[0]+(yr[1]-yr[0])*j/N, yb=yr[0]+(yr[1]-yr[0])*(j+1)/N;
    const za=Z[i][j], zb=Z[i+1][j], zc=Z[i+1][j+1], zd=Z[i][j+1];
    if(![za,zb,zc,zd].every(isFinite)) continue;
    const P=[proj(xa,ya,za),proj(xb,ya,zb),proj(xb,yb,zc),proj(xa,yb,zd)];
    /* 법선(정규화 좌표계) */
    const ux=nx(xb)-nx(xa), uy=0, uz=nz(zb)-nz(za);
    const vx=0, vy=ny(yb)-ny(ya), vz=nz(zd)-nz(za);
    let n1=uy*vz-uz*vy, n2=uz*vx-ux*vz, n3=ux*vy-uy*vx;
    const nl=Math.hypot(n1,n2,n3)||1; n1/=nl;n2/=nl;n3/=nl;
    const lam=Math.max(0.30, Math.abs(n1*0.42+n2*0.30+n3*0.85));
    quads.push({P, d:(P[0][2]+P[1][2]+P[2][2]+P[3][2])/4, t:nz((za+zb+zc+zd)/4), lam});
  }
  quads.sort((A,B)=>B.d-A.d);
  const lowC=o.low||'#cfd9e4', hiC=o.high||'#e8d3c2';
  quads.forEach(q=>{
    const base=mixHex(lowC,hiC,q.t);
    c.beginPath(); c.moveTo(q.P[0][0],q.P[0][1]);
    for(let k=1;k<4;k++) c.lineTo(q.P[k][0],q.P[k][1]);
    c.closePath();
    c.fillStyle=shade(base,q.lam); c.fill();
    c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=0.6; c.stroke();
  });
  function shade(rgb,l){
    const m=rgb.match(/\d+/g);
    return 'rgb('+m.map(v=>Math.round(Math.min(255,v*l*1.15))).join(',')+')';
  }
  return {proj, zmin, zmax, ctx:c, W, H};
}
/* 표면 위 곡선 */
function curve3D(S, pts, color, lw){
  const c=S.ctx; c.save(); c.strokeStyle=color; c.lineWidth=lw||3; c.lineJoin='round'; c.lineCap='round';
  c.beginPath();
  pts.forEach((p,i)=>{ const q=S.proj(p[0],p[1],p[2]); if(i===0)c.moveTo(q[0],q[1]); else c.lineTo(q[0],q[1]); });
  c.stroke(); c.restore();
}
function label3D(S, p, s, color){
  const q=S.proj(p[0],p[1],p[2]); const c=S.ctx; c.save();
  c.font='700 12px system-ui,sans-serif'; c.fillStyle='#fff';
  const w=c.measureText(s).width;
  c.fillRect(q[0]-w/2-4,q[1]-16,w+8,16);
  c.fillStyle=color||CL.ink; c.textAlign='center'; c.textBaseline='bottom';
  c.fillText(s,q[0],q[1]-3); c.restore();
}

/* ---------- 인터랙션 헬퍼 ---------- */
function onDrag(cv, handler){
  let on=false;
  const pos=e=>{ const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e; return [t.clientX-r.left, t.clientY-r.top]; };
  const down=e=>{ on=true; handler(pos(e),'down'); e.preventDefault(); };
  const move=e=>{ if(!on) return; handler(pos(e),'move'); e.preventDefault(); };
  const up=()=>{ on=false; };
  cv.addEventListener('mousedown',down); cv.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
}
function slider(id, cb){
  const el=document.getElementById(id); if(!el) return null;
  const out=document.getElementById(id+'-v');
  const upd=()=>{ const v=parseFloat(el.value); if(out) out.textContent=(el.dataset.fmt? (+v).toFixed(+el.dataset.fmt):v); cb(v); };
  el.addEventListener('input',upd); upd(); return el;
}
function toggle(id, cb){
  const el=document.getElementById(id); if(!el) return null;
  el.addEventListener('click',()=>{ el.classList.toggle('on'); cb(el.classList.contains('on')); });
  return el;
}
function rs(id, html){ const e=document.getElementById(id); if(e) e.innerHTML=html; }

window.VZ = {Frame, drawContours, contourSegs, heat, mixHex, surface3D, curve3D, label3D, onDrag, slider, toggle, rs, fit, niceStep};

/* 리사이즈 재그리기 등록소 */
const redraws=[];
window.VZreg = fn => { redraws.push(fn); fn(); };
let rt=null;
window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>redraws.forEach(f=>f()),160); });
})();
</script>
